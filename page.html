        img {

        .product-cards {
            display: flex;
            gap: 25px;
        }

        .product-card {
            width: 33.33%;
        }

        .product-card-wrapper {}

        .product-image-wrapper {
            padding: 0 10%;
        }

        .product-image {
            position: relative;
            padding-bottom: 100%;
            /* background-color: rosybrown; */
        }

        .product-image::before {
            content: "";
            position: absolute;
            top: 1%;
            left: 1%;
            width: 98%;
            height: 98%;
            border-radius: 50%;
            z-index: 2;
            border: 1px solid #e0c6ad;
        }

        .product-image::after {
            content: "";
            position: absolute;
            top: -2.5%;
            left: -2.5%;
            width: 105%;
            height: 105%;
            background-color: #fff;
            border-radius: 50%;
        }

        .product-image img {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            object-fit: cover;
            border-radius: 50%;
            z-index: 3;
        }

        .product-content-wprapper {
            background-color: rgb(255, 255, 255);
            margin-top: -40%;
            padding-top: 40%;
            border-radius: 30px;
        }

        .product-content {
            padding: 20px;
        }
